name: Build sing-box PQC Slim + SB-XHTTP Stage 1 (Reality / PQC)

# Source profile is permanent in include/registry.go and include/quic.go.
# All five proxy families have inbound + outbound support.
# Full TUN, Redirect, TProxy, Fake-IP, DNS, route rules and Clash API remain.
# Legacy Xray XHTTP patch is removed; standalone SB-XHTTP is built-in (no with_xhttp tag).
# Android, Windows and Linux artifacts use the same source profile.
# Artifact targets: Android arm64 release APK; Windows amd64; Linux amd64/arm64 static-musl.

on:
  push:
    branches:
      - pqc-new
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'dateblue/intel 的分支或 tag (留空 = pqc-new)'
        required: false
        default: ''
        type: string
      version:
        description: '写入二进制的版本号'
        required: false
        default: '1.15.0-pqc-slim-sbxhttp-s1'
        type: string

env:
  CORE_REPO: https://github.com/dateblue/intel.git
  CORE_REF: ${{ inputs.core_ref || 'pqc-new' }}
  VERSION: ${{ inputs.version || '1.15.0-pqc-slim-sbxhttp-s1' }}
  # QUIC=HY2/TUIC/HTTP3 DNS; uTLS=Reality/PQC; Naive outbound is a build-tag opt-in.
  # SB-XHTTP, TUN, Fake-IP, SOCKS, VLESS inbound/outbound and sniff override are not build-tag gated.
  BASE_TAGS: with_quic,with_utls,with_clash_api,with_naive_outbound,badlinkname,tfogo_checklinkname0

jobs:
  # ------------------------------------------------------------------
  # A. Android APK (arm64, PQC slim + SB-XHTTP)
  # ------------------------------------------------------------------
  apk:
    name: Android APK (arm64, PQC slim + SB-XHTTP)
    runs-on: ubuntu-24.04

    steps:
      # 1. 拉取 Android 客户端外壳 (SFA)
      - name: Checkout sing-box-for-android
        uses: actions/checkout@v7
        with:
          repository: 'SagerNet/sing-box-for-android'
          submodules: 'recursive'
          fetch-depth: 0

      # 2. 将官方 sing-box 核心替换为自定义的 dateblue/intel 代码
      - name: Replace core with custom dateblue/intel
        run: |
          rm -rf sing-box
          if [ -n "$CORE_REF" ]; then
            git clone --depth 1 --branch "$CORE_REF" "$CORE_REPO" sing-box
          else
            git clone --depth 1 "$CORE_REPO" sing-box
          fi
          echo "Android core SHA: $(git -C sing-box rev-parse HEAD)"
          test -f sing-box/include/registry.go
          test -f sing-box/include/quic.go
          test ! -e sing-box/transport/v2rayxhttp
          test ! -e sing-box/transport/v2ray/client_xhttp_enabled.go
          test -f sing-box/transport/sbxhttp/client.go
          test -f sing-box/transport/sbxhttp/server.go
          test -f sing-box/transport/sbxhttp/conn.go
          python3 sing-box/scripts/verify_slim_profile.py

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: sing-box/go.sum

      # Gradle 打包仍使用原来的 NDK 25
      - name: Setup Android SDK & NDK 25
        id: setup-android
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653'

      # naive (cronet) 的 cgo 链接用 NDK r28, 与上游 release 一致
      - name: Setup Android NDK r28 (for libbox)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      # Shared Android libbox flags are permanently slim in the source tree.
      - name: Verify slim libbox build tags
        run: |
          set -euo pipefail
          python3 sing-box/scripts/verify_slim_profile.py
          grep -n 'sharedTags = append' sing-box/cmd/internal/build_libbox/main.go

      # 4. 编译核心 (仅 arm64)
      - name: Build Libbox Core (arm64, PQC slim)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd sing-box
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          mkdir -p ../app/libs
          cp libbox.aar ../app/libs/libbox.aar

      # 5. 检查 libbox.so 体积; cronet-go 应当存在 (说明 naive 已编入)
      - name: Inspect libbox
        run: |
          rm -rf /tmp/aar && mkdir -p /tmp/aar
          unzip -o app/libs/libbox.aar 'jni/arm64-v8a/libbox.so' -d /tmp/aar
          ls -l /tmp/aar/jni/arm64-v8a/libbox.so
          for k in 'tailscale.com/' 'golang.zx2c4.com/wireguard' 'cronet-go'; do
            echo "$k : $(grep -a -c -i "$k" /tmp/aar/jni/arm64-v8a/libbox.so || true)"
          done

      # 6. 固定 Android Release 签名。严禁临时生成随机 keystore，避免每次 APK 签名变化。
      # 仓库 Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #                ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # 可选仓库 Variable: ANDROID_SIGNING_CERT_SHA256（固定预期证书 SHA-256，防误换签名）。
      - name: Build and verify permanently signed Release APK
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail

          # 缺失任何 Secrets 就停止。绝不生成一次性签名，防止产出无法覆盖升级的 APK。
          if [ -z "$KEY_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo '::error::Missing Android signing Secrets. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.'
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/singbox-release.keystore"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          (umask 077; printf '%s' "$KEY_B64" | base64 --decode > "$KEYSTORE_FILE")
          test -s "$KEYSTORE_FILE" || { echo '::error::Decoded keystore is empty.'; exit 1; }
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" > /dev/null

          # Keystore 中证书的 SHA-256 指纹（不是私钥，打印这个值是安全的）。
          signing_sha256=$(keytool -exportcert -keystore "$KEYSTORE_FILE" \
            -storepass "$STORE_PASS" -alias "$KEY_ALIAS" | openssl dgst -sha256 | awk '{print tolower($NF)}')
          [[ "$signing_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::Invalid keystore certificate fingerprint.'; exit 1; }

          # 若设置了期望指纹，发现换签名立即失败，不允许生成不同证书的 APK。
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            pinned=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
            if [ "$signing_sha256" != "$pinned" ]; then
              echo '::error::Keystore certificate does not match ANDROID_SIGNING_CERT_SHA256.'
              exit 1
            fi
          fi
          echo "Android signing certificate SHA-256: $signing_sha256"

          # SFA explicitly reads app/release.keystore and LOCAL_PROPERTIES.
          # Provide the SAME persistent key already verified above. No new key.
          install -m 600 "$KEYSTORE_FILE" app/release.keystore
          export LOCAL_PROPERTIES="$(python3 - <<'PY_SIGNING_PROPERTIES'
          import base64, os
          
          def escape_property(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('\t', '\\t').replace(' ', '\\ ')
          
          props = (
              'KEYSTORE_PASS=' + escape_property(os.environ['STORE_PASS']) + '\n'
              'ALIAS_NAME=' + escape_property(os.environ['KEY_ALIAS']) + '\n'
              'ALIAS_PASS=' + escape_property(os.environ['KEY_PASS']) + '\n'
          )
          print(base64.b64encode(props.encode()).decode())
          PY_SIGNING_PROPERTIES
          )"
          chmod +x ./gradlew
          ./gradlew :app:assembleOtherRelease \
            "-Pandroid.injected.signing.store.file=$KEYSTORE_FILE" \
            "-Pandroid.injected.signing.store.password=$STORE_PASS" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASS" \
            --stacktrace

          # 对实际上传的 arm64 APK 校验，而不是只相信 Gradle 参数。
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_DIR" || { echo '::error::ANDROID_HOME / ANDROID_SDK_ROOT is missing.'; exit 1; }
          APKSIGNER=$(find "$SDK_DIR/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER" || { echo '::error::Android apksigner was not found.'; exit 1; }

          # SIGNING-FINAL-20261024-R2: Re-sign the actual distributable APK
          # with the persistent release key. This is intentionally independent
          # of whether Gradle accepted android.injected.signing.* flags.
          # apksigner removes prior signatures when signing an existing APK.
          shopt -s nullglob
          apks=(app/build/outputs/apk/other/release/*arm64-v8a*.apk)
          ((${#apks[@]} > 0)) || { echo '::error::No arm64 release APK to verify/upload.'; exit 1; }
          for apk in "${apks[@]}"; do
            signed_apk="${apk%.apk}.signed.apk"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:STORE_PASS \
              --key-pass env:KEY_PASS \
              --out "$signed_apk" "$apk"
            info=$("$APKSIGNER" verify --verbose --print-certs "$signed_apk") || {
              echo "::error::APK signature verification failed: $signed_apk"; exit 1;
            }
            # apksigner versions differ: older "Signer #1 certificate ...",
            # newer "V2 Signer: certificate ..." or "V3.0 Signer: ...".
            # Read every certificate digest, requiring ONE consistent signer.
            apk_sha256=$(printf '%s\n' "$info" |
              awk '/certificate SHA-256 digest:/ {
                sub(/^.*certificate SHA-256 digest:[[:space:]]*/, "")
                gsub(/[:[:space:]]/, "")
                print tolower($0)
              }' | sort -u)
            if [[ ! "$apk_sha256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Could not parse a unique APK signing certificate: $apk"
              printf '%s\n' "$info" | grep -Ei 'signer|certificate SHA-256' || true
              exit 1
            fi
            echo "Expected signing cert SHA-256: $signing_sha256"
            echo "Actual APK signer cert SHA-256: $apk_sha256"
            if [ "$apk_sha256" != "$signing_sha256" ]; then
              echo "::error::APK uses a DIFFERENT signing certificate: $apk"
              exit 1
            fi
            # Replace distributable only AFTER the new APK passed verification.
            mv -f -- "$signed_apk" "$apk"
            echo "Verified signed APK: $apk (cert SHA-256: $apk_sha256)"
          done

      # 7. 上传 arm64-v8a 安装包
      - name: Upload APK Product
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-arm64-v8a-pqc-slim-release-apk
          path: app/build/outputs/apk/other/release/*arm64-v8a*.apk

  # ------------------------------------------------------------------
  # B. 命令行二进制: windows-amd64 / linux-amd64-musl / linux-arm64-musl
  # ------------------------------------------------------------------
  binaries:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            goos: windows
            goarch: amd64
            cgo: '0'
            bin: sing-box.exe
            extra_tags: ',with_purego'
            libc_flag: ''
            archive: zip
          - name: linux-amd64-musl
            goos: linux
            goarch: amd64
            cgo: '1'
            bin: sing-box
            extra_tags: ',with_musl'
            libc_flag: '--libc=musl'
            archive: tar
          - name: linux-arm64-musl
            goos: linux
            goarch: arm64
            cgo: '1'
            bin: sing-box
            extra_tags: ',with_musl'
            libc_flag: '--libc=musl'
            archive: tar

    steps:
      - name: Clone core (dateblue/intel)
        run: |
          set -euo pipefail
          if [ -n "$CORE_REF" ]; then
            git clone --depth 1 --branch "$CORE_REF" "$CORE_REPO" core
          else
            git clone --depth 1 "$CORE_REPO" core
          fi
          echo "CLI core SHA: $(git -C core rev-parse HEAD)"
          test -f core/include/registry.go
          test -f core/include/quic.go
          test ! -e core/transport/v2rayxhttp
          test ! -e core/transport/v2ray/client_xhttp_enabled.go
          test -f core/transport/sbxhttp/client.go
          test -f core/transport/sbxhttp/server.go
          test -f core/transport/sbxhttp/conn.go
          python3 core/scripts/verify_slim_profile.py

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: core/go.sum


      # First verify SB-XHTTP as a native Linux test (one job only, before cross builds).
      # Naive outbound is omitted from these package-level tests; full build below still includes it.
      - name: Test SB-XHTTP packages (Go race detector)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          cd core
          go test -race -count=1 -timeout=300s \
            -tags 'with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0' \
            -ldflags '-checklinkname=0' \
            ./transport/sbxhttp ./transport/v2ray ./protocol/vless ./option

      - name: Resolve cronet-go version
        run: |
          set -euo pipefail
          if [ -s core/.github/CRONET_GO_VERSION ]; then
            V=$(tr -d '[:space:]' < core/.github/CRONET_GO_VERSION)
          else
            V=$(grep -oE 'cronet-go/all v[^ ]+' core/go.mod | head -n1 | awk '{print $2}' | sed -E 's/.*-([0-9a-f]{12})$/\1/')
          fi
          test -n "$V"
          echo "cronet-go version: $V"
          echo "CRONET_GO_VERSION=$V" >> "$GITHUB_ENV"

      # ---------------- Linux (CGO) ----------------
      - name: Clone cronet-go
        if: matrix.cgo == '1'
        run: |
          set -xeuo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/sagernet/cronet-go.git ~/cronet-go
          cd ~/cronet-go
          git sparse-checkout set --no-cone '/*' '!/lib'
          git checkout "$CRONET_GO_VERSION"
          git submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring
        if: matrix.cgo == '1'
        run: |
          set -xeuo pipefail
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Download Chromium toolchain
        if: matrix.cgo == '1'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} ${{ matrix.libc_flag }} download-toolchain

      - name: Set Chromium toolchain environment
        if: matrix.cgo == '1'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} ${{ matrix.libc_flag }} env >> "$GITHUB_ENV"

      # ---------------- 编译 ----------------
      - name: Verify slim source before compiling
        run: python3 core/scripts/verify_slim_profile.py

      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -xeuo pipefail
          if [ -s core/release/LDFLAGS ]; then
            LDFLAGS_SHARED=$(cat core/release/LDFLAGS)
          else
            LDFLAGS_SHARED="-X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0"
          fi
          mkdir -p dist
          cd core
          go build -v -trimpath -buildvcs=false -o "../dist/${{ matrix.bin }}" \
            -tags "${BASE_TAGS}${{ matrix.extra_tags }}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      # Ensure Linux artifacts do not depend on a musl/glibc dynamic loader
      - name: Verify Linux static linkage
        if: matrix.goos == 'linux'
        run: |
          set -euo pipefail
          file dist/sing-box
          readelf -h dist/sing-box | grep -E 'Class:|Machine:'
          if readelf -l dist/sing-box | grep -q 'INTERP'; then
            echo 'ERROR: Linux binary is dynamically linked and not portable.'
            readelf -l dist/sing-box | grep -A1 INTERP
            exit 1
          fi
          if readelf -d dist/sing-box | grep -q '(NEEDED)'; then
            echo 'ERROR: Linux binary still has shared library dependencies.'
            readelf -d dist/sing-box | grep '(NEEDED)'
            exit 1
          fi
          echo 'PASS: no ELF interpreter or shared library dependencies'

      # ---------------- Windows: purego 需要随附 libcronet.dll ----------------
      - name: Fetch libcronet.dll
        if: matrix.cgo == '0'
        run: |
          set -xeuo pipefail
          LIB="lib/windows_${{ matrix.goarch }}/libcronet.dll"
          git clone --filter=blob:none --no-checkout https://github.com/sagernet/cronet-go.git "$RUNNER_TEMP/cronet-go-lib"
          cd "$RUNNER_TEMP/cronet-go-lib"
          git sparse-checkout set --no-cone "/$LIB"
          git checkout "$CRONET_GO_VERSION"
          cp "$LIB" "$GITHUB_WORKSPACE/dist/"
          test -s "$GITHUB_WORKSPACE/dist/libcronet.dll"

      - name: Package
        run: |
          set -xeuo pipefail
          NAME="sing-box-${VERSION}-${{ matrix.name }}"
          mkdir -p "pkg/${NAME}"
          cp dist/* "pkg/${NAME}/"
          git -C core rev-parse HEAD > "pkg/${NAME}/source-commit.txt"
          if [ -f core/LICENSE ]; then cp core/LICENSE "pkg/${NAME}/"; fi
          ls -l "pkg/${NAME}"
          cd pkg
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "${NAME}.zip" "${NAME}"
          else
            tar -czvf "${NAME}.tar.gz" "${NAME}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-${{ matrix.name }}
          path: |
            pkg/*.zip
            pkg/*.tar.gz
          if-no-files-found: error