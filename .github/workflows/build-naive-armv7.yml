name: Build sing-box Linux ARMv7 (Naive + XHTTP)

# Standalone workflow: .github/workflows/build-naive-armv7.yml
on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'dateblue/intel branch or tag (empty = default)'
        required: false
        default: ''
        type: string
      version:
        description: 'Embedded sing-box version'
        required: false
        default: '1.15.0-custom-naive-xhttp-armv7'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-naive-armv7.yml'

permissions:
  contents: read

env:
  CORE_REPO: https://github.com/dateblue/intel.git
  CORE_REF: ${{ inputs.core_ref }}
  VERSION: ${{ inputs.version || '1.15.0-custom-naive-xhttp-armv7' }}
  BASE_TAGS: with_quic,with_utls,with_dhcp,with_clash_api,with_naive,with_naive_outbound,with_xhttp,with_musl,badlinkname,tfogo_checklinkname0

jobs:
  build-armv7:
    name: Linux ARM 32-bit / musl / Naive / XHTTP
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Clone custom sing-box core
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$CORE_REF" ]; then
            git clone --depth 1 --branch "$CORE_REF" "$CORE_REPO" core
          else
            git clone --depth 1 "$CORE_REPO" core
          fi
          git -C core rev-parse HEAD

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false

      - name: Resolve cronet-go revision
        shell: bash
        run: |
          set -euo pipefail
          if [ -s core/.github/CRONET_GO_VERSION ]; then
            V=$(tr -d '[:space:]' < core/.github/CRONET_GO_VERSION)
          else
            V=$(grep -oE 'cronet-go/all v[^ ]+' core/go.mod | head -n 1 | awk '{print $2}' | sed -E 's/.*-([0-9a-f]{12})$/\1/')
          fi
          test -n "$V"
          echo "CRONET_GO_VERSION=$V" >> "$GITHUB_ENV"
          echo "cronet-go revision: $V"

      - name: Clone cronet-go (matching core)
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/sagernet/cronet-go.git "$HOME/cronet-go"
          cd "$HOME/cronet-go"
          git sparse-checkout set --no-cone '/*' '!/lib'
          git checkout "$CRONET_GO_VERSION"
          git submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$HOME/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg"
          cd "$HOME/cronet-go"
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Download Chromium ARM musl toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/cronet-go"
          go run ./cmd/build-naive --target=linux/arm --libc=musl download-toolchain

      - name: Export Chromium cross-compiler environment
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/cronet-go"
          go run ./cmd/build-naive --target=linux/arm --libc=musl env >> "$GITHUB_ENV"

      - name: Build ARM32 sing-box with Naive
        shell: bash
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '5'
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          if [ -s core/release/LDFLAGS ]; then
            LDFLAGS_SHARED=$(cat core/release/LDFLAGS)
          else
            LDFLAGS_SHARED='-X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0'
          fi
          mkdir -p dist
          cd core
          go build -v -trimpath -buildvcs=false \
            -tags "$BASE_TAGS" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${VERSION} ${LDFLAGS_SHARED} -s -w -buildid=" \
            -o ../dist/sing-box \
            ./cmd/sing-box

      - name: Inspect executable and package
        shell: bash
        run: |
          set -euo pipefail
          file dist/sing-box
          readelf -h dist/sing-box | grep -E 'Class:|Machine:|Flags:'
          readelf -l dist/sing-box | grep -A1 INTERP || true
          ls -lh dist/sing-box
          NAME="sing-box-${VERSION}-linux-armv7-musl-naive-xhttp"
          mkdir -p "pkg/$NAME"
          cp dist/sing-box "pkg/$NAME/"
          if [ -f core/LICENSE ]; then cp core/LICENSE "pkg/$NAME/"; fi
          (cd pkg && tar -czf "${NAME}.tar.gz" "$NAME")
          sha256sum "pkg/${NAME}.tar.gz" > "pkg/${NAME}.tar.gz.sha256"

      - name: Upload ARMv7 artifact
        uses: actions/upload-artifact@v7
        with:
          name: sing-box-linux-armv7-musl-naive-xhttp
          path: |
            pkg/*.tar.gz
            pkg/*.sha256
          if-no-files-found: error
